    function renderSetup() { const x=t(); app.innerHTML=`<main class="setup"><section class="setup-visual"><a class="brand" href="#"><i class="mark"></i>MyMovieWorld</a><div class="setup-copy"><p class="eyebrow">${x.setupEye}</p><h1>${x.setupTitle}</h1><p>${x.setupText}</p></div><div class="setup-footer"><span class="dot orange"></span>Browser-only · encrypted before transfer · Nostr signed</div></section><section class="setup-panel"><div class="key-console"><p class="eyebrow">01 / Identity</p><h2>${x.keyTitle}</h2><p>${x.keyText}</p><div class="switch"><button data-action="mode-create" class="${state.createMode==="create"?"active":""}">${x.create}</button><button data-action="mode-import" class="${state.createMode==="import"?"active":""}">${x.import}</button></div><div class="key-action">${state.createMode==="create"?`<button class="primary" data-action="generate">◇ ${x.createAction}</button>`:`<input class="key-input" id="key-input" value="${esc(state.keyValue)}" placeholder="${x.keyPlaceholder}" autocomplete="off" spellcheck="false"><button class="primary" style="margin-top:10px" data-action="import">◇ ${x.importAction}</button>`}</div>${state.revealed?`<div class="generated"><p>${x.generated}</p><code>${state.revealed}</code></div>`:""}<div class="key-note"><b>◇</b><div><strong>${x.keyNote}</strong><br>${RELAY}</div></div><div class="relay"><span class="dot ${state.relay==="ready"?"":state.relay==="checking"?"orange":"off"}"></span>${state.relay==="ready"?x.ready:state.relay==="checking"?x.checking:x.offline} · ${x.relay}</div>${noticeHTML()}</div></section></main>`; bind(); }
    function renderCabinet() { const x=t(); const rows=state.movies.length?state.movies.map((m,i)=>`<div class="movie ${state.active?.sha256===m.sha256?"selected":""}" data-select="${m.sha256}" role="button" tabindex="0"><div class="movie-index">${String(i+1).padStart(2,"0")}</div><div><p class="movie-name">${esc(movieName(m))}</p><p class="movie-meta">${size(m.size)} · ${date(m.uploaded)} · ${m.sha256.slice(0,10)}</p></div><div class="row-actions"><button class="icon-button" title="${x.load}" data-play="${m.sha256}">▶</button><button class="icon-button" title="${x.download}" data-download="${m.sha256}">⇩</button><button class="icon-button" title="${x.delete}" data-delete="${m.sha256}">×</button></div></div>`).join(""):`<div class="empty"><div class="archive-drawer"></div><div><h3>${x.emptyTitle}</h3><p>${x.emptyText}</p></div></div>`; const transfer=state.busy?`<div class="transfer"><p>${esc(state.busy.name||"")}</p><div class="track"><div class="fill" style="transform:scaleX(${Math.max(state.busy.progress||0,state.busy.progress===0?.12:0)/100})"></div></div><div class="transfer-caption"><span>${esc(state.busy.detail||"")}</span><span>${state.busy.progress?state.busy.progress+"%":""}</span></div></div>`:`<input id="file-input" type="file" accept="video/*"><label class="file-label" for="file-input">⇧ ${x.stageHint}<small>${x.stageNote}</small></label>`; const player=state.active&&state.playerURL?`<video controls autoplay src="${state.playerURL}"></video><div class="player-detail"><div><h3>${esc(movieName(state.active))}</h3><p>${x.loaded}</p></div><button class="mini" data-download="${state.active.sha256}">⇩</button></div>`:state.active?`<div class="player-empty"><button class="primary" style="width:auto;min-height:44px" data-play="${state.active.sha256}">▶ ${x.load}</button></div>`:`<div class="player-empty">${x.playerEmpty}</div>`; app.innerHTML=`<main class="app"><aside class="rail"><a class="brand" href="#library"><i class="mark"></i>MyMovieWorld</a><p class="rail-caption">${x.archive}</p><nav class="nav"><button class="active" data-scroll="library"><b>01</b>${x.library}</button><button data-scroll="transfer"><b>02</b>${x.transfer}</button><button data-scroll="player"><b>03</b>${x.player}</button></nav><div class="rail-status"><div><span class="dot"></span>${x.armed}</div><p>${state.pubkey.slice(0,18)}…</p><div class="rail-actions"><button class="mini" data-action="sync">${x.refresh}</button><button class="mini" data-action="erase">${x.erase}</button></div></div></aside><section class="main"><div class="utility"><div class="connection"><span class="dot ${state.relay==="ready"?"":"off"}"></span>${RELAY.replace("wss://","")}</div><div class="lang"><button data-lang="en" class="${state.lang==="en"?"active":""}">EN</button><button data-lang="ko" class="${state.lang==="ko"?"active":""}">KO</button></div></div><header class="dash-title"><div><p class="eyebrow">${x.dashboardEye}</p><h1>${x.dashboardTitle}</h1></div><p class="dash-detail">${x.dashboardDetail}</p></header><div class="grid"><section class="module" id="library"><div class="module-head"><h2>${x.remote}</h2><span class="mono">${state.movies.length} ${x.items}</span></div><div class="library">${rows}</div></section><div class="stack"><section class="module upload" id="transfer"><div class="module-head"><h2>${x.stage}</h2><span class="mono">PUT /upload</span></div><div class="upload-zone" id="drop-zone">${transfer}</div></section><section class="module player" id="player"><div class="module-head"><h2 style="color:#fff">${x.playerTitle}</h2><span class="mono" style="color:rgba(255,255,255,.55)">AES-GCM</span></div>${player}</section></div></div>${noticeHTML()}</section></main>${dialogHTML()}`; bind(); }
    function noticeHTML(){return state.notice?`<div class="notice ${state.notice.error?"error":""}"><span><strong>${t().connection}</strong><br>${esc(state.notice.message)}</span><button class="notice-close" data-action="notice-close">×</button></div>`:"";}

    function bind(){ document.querySelectorAll("[data-action]").forEach(e=>e.addEventListener("click",()=>action(e.dataset.action))); document.querySelectorAll("[data-lang]").forEach(e=>e.addEventListener("click",()=>{state.lang=e.dataset.lang;localStorage.setItem("mymovieworld:lang",state.lang);render();})); document.querySelectorAll("[data-scroll]").forEach(e=>e.addEventListener("click",()=>document.getElementById(e.dataset.scroll)?.scrollIntoView({behavior:"smooth"}))); document.querySelectorAll("[data-select]").forEach(e=>e.addEventListener("click",()=>{state.active=state.movies.find(m=>m.sha256===e.dataset.select); if(state.playerURL){URL.revokeObjectURL(state.playerURL);state.playerURL="";}render();})); document.querySelectorAll("[data-play]").forEach(e=>e.addEventListener("click",ev=>{ev.stopPropagation();preparePlayback(e.dataset.play)})); document.querySelectorAll("[data-download]").forEach(e=>e.addEventListener("click",ev=>{ev.stopPropagation();saveMovie(e.dataset.download)})); document.querySelectorAll("[data-delete]").forEach(e=>e.addEventListener("click",ev=>{ev.stopPropagation();state.pending=state.movies.find(m=>m.sha256===e.dataset.delete);render();})); const input=document.getElementById("file-input"); if(input)input.addEventListener("change",e=>{const f=e.target.files?.[0];if(f)stageUpload(f);e.target.value="";}); const zone=document.getElementById("drop-zone"); if(zone){zone.addEventListener("dragover",e=>{e.preventDefault();zone.classList.add("drag")});zone.addEventListener("dragleave",()=>zone.classList.remove("drag"));zone.addEventListener("drop",e=>{e.preventDefault();zone.classList.remove("drag");const f=e.dataTransfer.files?.[0];if(f)stageUpload(f);});} const key=document.getElementById("key-input");if(key)key.addEventListener("input",e=>state.keyValue=e.target.value); }
    function action(name){if(name==="mode-create"){state.createMode="create";render()}else if(name==="mode-import"){state.createMode="import";render()}else if(name==="generate"){try{saveSecret(randomSecret())}catch(e){setNotice(e.message,true)}}else if(name==="import"){try{saveSecret(parseSecret(state.keyValue))}catch{setNotice(t().keyBad,true)}}else if(name==="sync"){sync()}else if(name==="erase"){localStorage.removeItem(KEY_STORE);state.secret=null;state.pubkey="";state.movies=[];state.active=null;if(state.playerURL)URL.revokeObjectURL(state.playerURL);state.playerURL="";state.revealed="";state.notice=null;render()}else if(name==="notice-close"){state.notice=null;render()}else if(name==="cancel-delete"){state.pending=null;render()}else if(name==="confirm-delete"){deleteMovie(state.pending)}}
    function mod(a,m=P){const x=a%m;return x>=0n?x:x+m} function pow(a,b,m=P){let r=1n;let x=mod(a,m);while(b){if(b&1n)r=mod(r*x,m);x=mod(x*x,m);b>>=1n}return r} function inv(a){return pow(a,P-2n)} function add(a,b){if(!a)return b;if(!b)return a;if(a.x===b.x&&a.y!==b.y)return null;let s;if(a.x===b.x){if(a.y===0n)return null;s=mod(3n*a.x*a.x*inv(2n*a.y))}else s=mod((b.y-a.y)*inv(b.x-a.x));const x=mod(s*s-a.x-b.x);return{x,y:mod(s*(a.x-x)-a.y)}} function mul(k,point=G){let r=null,q=point;while(k){if(k&1n)r=add(r,q);q=add(q,q);k>>=1n}return r}
    function concat(...parts){const n=parts.reduce((a,p)=>a+p.length,0);const out=new Uint8Array(n);let at=0;for(const p of parts){out.set(p,at);at+=p.length}return out} function num(v,len=32){const out=new Uint8Array(len);for(let i=len-1;i>=0;i--){out[i]=Number(v&255n);v>>=8n}return out} function numFrom(v){let n=0n;for(const x of v)n=(n<<8n)+BigInt(x);return n} function hex(v){return [...v].map(x=>x.toString(16).padStart(2,"0")).join("")} function fromHex(s){if(!/^[0-9a-f]{64}$/i.test(s.trim()))throw Error("invalid");const a=new Uint8Array(32);for(let i=0;i<32;i++)a[i]=parseInt(s.trim().slice(i*2,i*2+2),16);return a} function base64(v){let s="";for(let i=0;i<v.length;i+=16384)s+=String.fromCharCode(...v.subarray(i,i+16384));return btoa(s)} function unbase64(s){const raw=atob(s),out=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)out[i]=raw.charCodeAt(i);return out}
    async function sha(v){return new Uint8Array(await crypto.subtle.digest("SHA-256",v))} async function tagged(label,data){const tag=await sha(ENCODER.encode(label));return sha(concat(tag,tag,data))} function xor(a,b){const c=new Uint8Array(a.length);for(let i=0;i<a.length;i++)c[i]=a[i]^b[i];return c}
    function encodeNsec(secret){const data=convertBits(secret,8,5,true);const values=bechHrp("nsec").concat(data);const checksum=bechChecksum(values).map(v=>"qpzry9x8gf2tvdw0s3jn54khce6mua7l"[v]);return "nsec1"+data.map(v=>"qpzry9x8gf2tvdw0s3jn54khce6mua7l"[v]).join("")+checksum.join("")} function decodeNsec(text){const s=text.trim().toLowerCase();if(!s.startsWith("nsec1"))return fromHex(s);const chars="qpzry9x8gf2tvdw0s3jn54khce6mua7l";const values=[...s.slice(5)].map(c=>chars.indexOf(c));if(values.some(v=>v<0)||bechPoly(bechHrp("nsec").concat(values))!==1)throw Error("invalid");return new Uint8Array(convertBits(values.slice(0,-6),5,8,false))} function bechPoly(v){let c=1;for(const x of v){const b=c>>>25;c=(c&0x1ffffff)<<5^x;if(b&1)c^=0x3b6a57b2;if(b&2)c^=0x26508e6d;if(b&4)c^=0x1ea119fa;if(b&8)c^=0x3d4233dd;if(b&16)c^=0x2a1462b3}return c>>>0} function bechHrp(h){const o=[];for(const c of h)o.push(c.charCodeAt(0)>>5);o.push(0);for(const c of h)o.push(c.charCodeAt(0)&31);return o} function bechChecksum(v){const p=bechPoly(v.concat([0,0,0,0,0,0]))^1;return[0,1,2,3,4,5].map(i=>(p>>>5*(5-i))&31)} function convertBits(data,from,to,pad){let acc=0,bits=0,out=[],max=(1<<to)-1;for(const value of data){if(value<0||value>>from)throw Error("invalid");acc=(acc<<from)|value;bits+=from;while(bits>=to){bits-=to;out.push((acc>>bits)&max)}}if(pad){if(bits)out.push((acc<<(to-bits))&max)}else if(bits>=from||((acc<<(to-bits))&max))throw Error("invalid");return out}

    async function derive(secret,salt){const source=await crypto.subtle.importKey("raw",secret,"HKDF",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"HKDF",hash:"SHA-256",salt,info:ENCODER.encode("MyMovieWorld encrypted video v1")},source,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
    async function opfs(){if(!isSupported())throw Error(t().unsupported);return navigator.storage.getDirectory()} function updateBusy(name,progress,detail){state.busy={name,progress,detail};render()}
    async function createContainer(file){const root=await opfs();const salt=crypto.getRandomValues(new Uint8Array(16));const key=await derive(state.secret,salt);const token=`mmw-${Date.now()}-${Math.random().toString(36).slice(2)}`;const handle=await root.getFileHandle(token,{create:true});const writer=await handle.createWritable();const header={v:1,name:file.name,type:file.type||"video/mp4",size:file.size,salt:base64(salt)};await writer.write(ENCODER.encode(MAGIC+"\n"+JSON.stringify(header)+"\n"));const reader=file.stream().getReader();let index=0,doneSize=0;try{while(true){const next=await reader.read();if(next.done)break;const iv=crypto.getRandomValues(new Uint8Array(12));const ad=ENCODER.encode(`${header.size}:${index}`);const encrypted=await crypto.subtle.encrypt({name:"AES-GCM",iv,additionalData:ad},key,next.value);await writer.write(ENCODER.encode(JSON.stringify({i:index,iv:base64(iv),data:base64(new Uint8Array(encrypted))})+"\n"));doneSize+=next.value.length;index++;updateBusy(file.name,Math.round(doneSize/file.size*62),t().preparing)}}finally{await writer.close()}const staged=await handle.getFile();return{root,token,staged,header}}
    function preflight(staged,auth){return fetch(CDN+"/upload",{method:"HEAD",headers:{Authorization:auth,"X-Content-Length":String(staged.size),"X-Content-Type":"text/plain; charset=utf-8"}}).then(r=>r.status===413||r.status===415||r.status===401||r.status===403?false:true).catch(()=>true)} function send(staged,auth,originalName){return new Promise((resolve,reject)=>{const r=new XMLHttpRequest();r.open("PUT",CDN+"/upload");r.setRequestHeader("Authorization",auth);r.setRequestHeader("Content-Type","text/plain; charset=utf-8");r.upload.onprogress=e=>{if(e.lengthComputable)updateBusy(originalName,62+Math.round(e.loaded/e.total*38),t().upload)};r.onerror=()=>reject(Error("Network transfer failed"));r.onload=()=>r.status>=200&&r.status<300?resolve(JSON.parse(r.responseText)):reject(Error(r.responseText||`HTTP ${r.status}`));r.send(staged)})}
    async function stageUpload(file){if(!file.type.startsWith("video/")){setNotice("Video MIME type required.",true);return}if(!isSupported()){setNotice(t().unsupported,true);return}try{updateBusy(file.name,1,t().preparing);const stage=await createContainer(file);const auth=await authorization("upload");if(!await preflight(stage.staged,auth)){await stage.root.removeEntry(stage.token);state.busy=null;setNotice("The storage server did not accept this transfer.",true);return}const descriptor=await send(stage.staged,auth,file.name);await stage.root.removeEntry(stage.token);state.catalog[descriptor.sha256]={...stage.header,url:descriptor.url,encryptedSize:descriptor.size,uploaded:descriptor.uploaded,owner:state.pubkey};saveCatalog();state.movies=[descriptor,...state.movies.filter(m=>m.sha256!==descriptor.sha256)];state.active=descriptor;state.busy={name:file.name,progress:100,detail:t().complete};render();setTimeout(()=>{state.busy=null;render()},2000)}catch(e){state.busy=null;setNotice(e.message||"Upload failed",true)}}
    async function* textLines(stream){const reader=stream.pipeThrough(new TextDecoderStream()).getReader();let carry="";while(true){const part=await reader.read();if(part.done)break;carry+=part.value;let cut;while((cut=carry.indexOf("\n"))>=0){yield carry.slice(0,cut);carry=carry.slice(cut+1)}}if(carry)yield carry}
    async function decryptToOpfs(movie,purpose){const root=await opfs();const token=`ready-${movie.sha256}-${Date.now()}`;const handle=await root.getFileHandle(token,{create:true});const writer=await handle.createWritable();const response=await fetch(movie.url,{headers:{Authorization:await authorization("get",movie.sha256)}});if(!response.ok||!response.body)throw Error(await response.text());const total=Number(response.headers.get("content-length")||movie.size||0);let read=0,index=0,header=null;try{for await(const line of textLines(response.body)){read+=line.length+1;if(index===0){if(line!==MAGIC)throw Error(t().invalidContainer);index++;continue}if(index===1){header=JSON.parse(line);index++;continue}if(!line)continue;const record=JSON.parse(line);const key=await derive(state.secret,unbase64(header.salt));const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:unbase64(record.iv),additionalData:ENCODER.encode(`${header.size}:${record.i}`)},key,unbase64(record.data));await writer.write(plain);updateBusy(header.name,Math.min(99,Math.round(read/total*100)),purpose)}await writer.close();return{root,token,handle,header}}catch(e){try{await writer.abort()}catch{}try{await root.removeEntry(token)}catch{}throw e}}
    async function preparePlayback(hash){const movie=state.movies.find(m=>m.sha256===hash);if(!movie)return;if(!isSupported()){setNotice(t().unsupported,true);return}try{updateBusy(movieName(movie),1,t().load);const ready=await decryptToOpfs(movie,t().load);const file=await ready.handle.getFile();if(state.playerURL)URL.revokeObjectURL(state.playerURL);state.playerURL=URL.createObjectURL(file);state.catalog[movie.sha256]={...ready.header};saveCatalog();state.active=movie;state.busy=null;render()}catch(e){state.busy=null;setNotice(e.message||"Playback preparation failed",true)}}
    async function saveMovie(hash){const movie=state.movies.find(m=>m.sha256===hash);if(!movie)return;if(!isSupported()){setNotice(t().unsupported,true);return}try{const suggested=(state.catalog[hash]?.name||"encrypted-video.mp4").replace(/[^a-zA-Z0-9._ -]/g,"_");const destination=await window.showSaveFilePicker({suggestedName:suggested,types:[{description:"Video",accept:{"video/*":[".mp4",".webm",".mov",".mkv"]}}]});updateBusy(suggested,1,t().saving);const ready=await decryptToOpfs(movie,t().saving);const output=await destination.createWritable();const staged=await ready.handle.getFile();await staged.stream().pipeTo(output);await ready.root.removeEntry(ready.token);state.catalog[hash]={...ready.header};saveCatalog();state.busy={name:ready.header.name,progress:100,detail:t().saved};render();setTimeout(()=>{state.busy=null;render()},2000)}catch(e){state.busy=null;if(!(e instanceof DOMException&&e.name==="AbortError"))setNotice(e.message||"Save failed",true)}}
    async function deleteMovie(movie){try{const response=await fetch(CDN+"/"+movie.sha256,{method:"DELETE",headers:{Authorization:await authorization("delete",movie.sha256)}});if(!response.ok)throw Error(await response.text());state.movies=state.movies.filter(m=>m.sha256!==movie.sha256);delete state.catalog[movie.sha256];saveCatalog();if(state.active?.sha256===movie.sha256){state.active=state.movies[0]||null;if(state.playerURL)URL.revokeObjectURL(state.playerURL);state.playerURL=""}state.pending=null;render()}catch(e){state.pending=null;setNotice(e.message||"Delete failed",true)}}
    function sync(){if(!state.secret)return;state.movies=Object.entries(state.catalog).filter(([,entry])=>!entry.owner||entry.owner===state.pubkey).map(([sha256,entry])=>({sha256,url:entry.url||`${CDN}/${sha256}`,size:Number(entry.encryptedSize||entry.size||0),type:"text/plain",uploaded:Number(entry.uploaded||0)})).sort((a,b)=>b.uploaded-a.uploaded);state.active=state.movies.find(x=>x.sha256===state.active?.sha256)||state.movies[0]||null;state.busy=null;state.notice=null;render()}
    function saveSecret(secret){state.secret=secret;state.pubkey=pub(secret);state.revealed=encodeNsec(secret);state.keyValue="";localStorage.setItem(KEY_STORE,state.revealed);render();sync()}
    function probe(){try{const ws=new WebSocket(RELAY);const timer=setTimeout(()=>{ws.close();state.relay="offline";render()},4000);ws.onopen=()=>{clearTimeout(timer);ws.close();state.relay="ready";render()};ws.onerror=()=>{clearTimeout(timer);state.relay="offline";render()}}catch{state.relay="offline"}}
    window.__mmwUploadMany=async(files)=>{const queue=[...files].filter(file=>file.type.startsWith("video/"));if(!queue.length){setNotice("Video MIME type required.",true);return}for(let index=0;index<queue.length;index++){await stageUpload(queue[index]);if(index<queue.length-1)await new Promise(resolve=>setTimeout(resolve,2100))}};
    window.__mmwDeleteMany=async(hashes)=>{for(const hash of hashes){const movie=state.movies.find(item=>item.sha256===hash);if(movie)await deleteMovie(movie)}};
    try{const saved=localStorage.getItem(KEY_STORE);if(saved){state.secret=parseSecret(saved);state.pubkey=pub(state.secret)}}catch{localStorage.removeItem(KEY_STORE)}render();probe();if(state.secret)sync();
  })();
  </script>
  <style>
    /* Signal Cabinet privacy refinement: relay internals stay out of the operator view; key export is deliberate. */
    .relay, .connection { display: none !important; }
    .utility { justify-content: flex-end; }
    .copy-key { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 34px; margin-top: 10px; border: 1px solid var(--ink); padding: 8px 10px; color: var(--ink); background: transparent; font: 600 10px/1 var(--mono); letter-spacing: .02em; }
    .copy-key:hover { color: #fff; background: var(--ink); }
    .rail-actions .copy-key { flex: 1; margin-top: 0; border-color: rgba(255,255,255,.22); color: #fff; background: rgba(255,255,255,.08); }
    .rail-actions .copy-key:hover { background: rgba(255,255,255,.16); }
  </style>
  <script>
    (() => {
      const keyStore = "mymovieworld:nostr-private-key";
      const label = () => localStorage.getItem("mymovieworld:lang") === "ko" ? "개인키 복사" : "Copy private key";
      const copied = () => localStorage.getItem("mymovieworld:lang") === "ko" ? "복사됨" : "Copied";
      const denied = () => localStorage.getItem("mymovieworld:lang") === "ko" ? "복사할 개인키가 없습니다" : "No private key to copy";
      async function copyKey(button) {
        const key = localStorage.getItem(keyStore);
        if (!key) { window.alert(denied()); return; }
        try {
          await navigator.clipboard.writeText(key);
          const original = button.textContent;
          button.textContent = `✓ ${copied()}`;
          window.setTimeout(() => { button.textContent = original; }, 1600);
        } catch { window.prompt(label(), key); }
      }
      function mount() {
        const saved = localStorage.getItem(keyStore);
        const note = document.querySelector(".key-note div");
        if (note && !note.dataset.relayHidden) {
          const strong = note.querySelector("strong");
          if (strong) note.replaceChildren(strong.cloneNode(true));
          note.dataset.relayHidden = "true";
        }
        if (!saved) return;
        const generated = document.querySelector(".generated");
        if (generated && !generated.querySelector("[data-copy-key]")) generated.insertAdjacentHTML("beforeend", `<button type="button" class="copy-key" data-copy-key>⧉ ${label()}</button>`);
        const actions = document.querySelector(".rail-actions");
        if (actions && !actions.querySelector("[data-copy-key]")) actions.insertAdjacentHTML("afterbegin", `<button type="button" class="copy-key" data-copy-key>⧉ ${label()}</button>`);
      }
      document.addEventListener("click", (event) => {
        const button = event.target.closest("[data-copy-key]");
        if (button) copyKey(button);
      });
      new MutationObserver(mount).observe(document.getElementById("app"), { childList: true, subtree: true });
      mount();
    })();
  </script>
  <script>
    (() => {
      const listDisabled = /server did not return your library|list endpoint is disabled|서버에서 내 라이브러리를 가져오지 못했습니다|목록 기능이 꺼져/i;
      const previewStatus = /this page is not live and cannot be shared directly/i;
      function clearStatusMessages() {
        document.querySelectorAll(".notice").forEach((notice) => {
          if (listDisabled.test(notice.textContent || "")) notice.remove();
        });
        document.querySelectorAll("body *").forEach((element) => {
          const ownText = element.textContent || "";
          const childHasSameMessage = [...element.children].some((child) => previewStatus.test(child.textContent || ""));
          if (previewStatus.test(ownText) && !childHasSameMessage) element.style.display = "none";
        });
      }
      new MutationObserver(clearStatusMessages).observe(document.body, { childList: true, subtree: true, characterData: true });
      clearStatusMessages();
    })();
  </script>
  <script>
    (() => {
      function replaceUploadHint() {
        const korean = localStorage.getItem("mymovieworld:lang") === "ko";
        document.querySelectorAll(".file-label small").forEach((hint) => {
          hint.textContent = korean ? "대용량 파일은 스트림 단위로 암호화·준비됩니다" : "Large files are encrypted and prepared as a stream";
        });
      }
      new MutationObserver(replaceUploadHint).observe(document.getElementById("app"), { childList: true, subtree: true });
      replaceUploadHint();
    })();
  </script>
  <style>
    /* Signal Cabinet library control: long reel shelves scroll inside their own measured viewport. */
    #library .module-head { align-items: center; }
    .reel-search { display: flex; align-items: center; gap: 8px; min-width: min(100%, 250px); }
    .reel-search input { width: 100%; min-width: 0; border: 1px solid var(--line); border-radius: 0; padding: 8px 9px; color: var(--ink); background: rgba(255,255,255,.54); outline: none; font: 10px/1.2 var(--mono); }
    .reel-search input:focus { border-color: var(--signal); box-shadow: 0 0 0 3px rgba(255,107,53,.12); }
    .reel-search input::placeholder { color: var(--muted); }
    #library .library { max-height: min(61vh, 610px); overflow-y: auto; overscroll-behavior: contain; scrollbar-color: var(--signal) var(--paper-deep); scrollbar-width: thin; }
    #library .library::-webkit-scrollbar { width: 10px; }
    #library .library::-webkit-scrollbar-track { background: var(--paper-deep); }
    #library .library::-webkit-scrollbar-thumb { border: 3px solid var(--paper-deep); background: var(--signal); }
    .filter-empty { display: none; padding: 34px 18px; color: var(--muted); text-align: center; font: 11px/1.6 var(--mono); }
    .filter-empty.visible { display: block; }
    @media (max-width: 680px) { #library .module-head { align-items: stretch; flex-direction: column; } .reel-search { width: 100%; } #library .library { max-height: 52vh; } }
  </style>
  <script>
    (() => {
      function mountReelSearch() {
        const library = document.getElementById("library");
        if (!library || library.querySelector("[data-reel-search]")) return;
        const head = library.querySelector(".module-head");
        const list = library.querySelector(".library");
        if (!head || !list) return;
        const korean = document.documentElement.lang === "ko";
        const placeholder = korean ? "제목 검색…" : "Search titles…";
        const resultLabel = korean ? "표시" : "shown";
        head.insertAdjacentHTML("beforeend", `<label class="reel-search"><input data-reel-search type="search" autocomplete="off" placeholder="${placeholder}" aria-label="${placeholder}"><span class="mono" data-reel-result></span></label>`);
        list.insertAdjacentHTML("beforeend", `<div class="filter-empty" data-filter-empty>${korean ? "일치하는 암호화된 릴이 없습니다." : "No encrypted reel matches this title."}</div>`);
        const input = library.querySelector("[data-reel-search]");
        const result = library.querySelector("[data-reel-result]");
        const empty = library.querySelector("[data-filter-empty]");
        const filter = () => {
          const query = input.value.trim().toLocaleLowerCase();
          const rows = [...list.querySelectorAll(".movie")];
          let visible = 0;
          rows.forEach((row) => {
            const match = !query || (row.querySelector(".movie-name")?.textContent || "").toLocaleLowerCase().includes(query);
            row.hidden = !match;
            if (match) visible++;
          });
          result.textContent = `${visible}/${rows.length} ${resultLabel}`;
          empty.classList.toggle("visible", rows.length > 0 && visible === 0);
        };
        input.addEventListener("input", filter);
        filter();
      }
      new MutationObserver(mountReelSearch).observe(document.getElementById("app"), { childList: true, subtree: true });
      mountReelSearch();
    })();
  </script>
  <style>
    /* Signal Cabinet batch controls: selection and destructive actions remain explicit, measured, and reversible until confirmed. */
    .batch-controls { display: inline-flex; align-items: center; gap: 6px; margin-left: auto; }
    .batch-controls button { min-height: 30px; border: 1px solid var(--line); padding: 7px 8px; color: var(--ink); background: rgba(255,255,255,.46); font: 600 9px/1 var(--mono); }
    .batch-controls button:hover:not(:disabled) { border-color: var(--ink); background: #fff; }
    .batch-controls .batch-delete { color: var(--danger); border-color: rgba(174,68,60,.35); }
    .batch-controls .batch-delete:hover:not(:disabled) { color: #fff; background: var(--danger); }
    .movie-index { position: relative; }
    .reel-choice { position: absolute; inset: 0; display: grid; place-items: center; cursor: pointer; background: inherit; }
    .reel-choice input { width: 15px; height: 15px; margin: 0; accent-color: var(--signal); }
    .movie.batch-picked { background: rgba(255,107,53,.08); box-shadow: inset 3px 0 0 var(--signal); }
    @media (max-width: 680px) { .batch-controls { width: 100%; margin: 2px 0 0; } .batch-controls button { flex: 1; } }
  </style>
  <script>
    (() => {
      const selected = new Set();
      const isKorean = () => document.documentElement.lang === "ko";
      const text = () => isKorean() ? { all: "전체 선택", clear: "선택 해제", remove: "선택 삭제", confirm: "선택한 {n}개의 암호화된 릴을 삭제할까요?" } : { all: "Select all", clear: "Clear", remove: "Delete selected", confirm: "Delete {n} selected encrypted reels?" };
      const uploadQueue = (files) => window.__mmwUploadMany?.(files);
      function mountBatchControls() {
        document.querySelectorAll("#file-input").forEach((input) => { input.multiple = true; });
        const library = document.getElementById("library");
        if (!library) return;
        const head = library.querySelector(".module-head");
        const list = library.querySelector(".library");
        if (!head || !list) return;
        const rows = [...list.querySelectorAll(".movie")];
        rows.forEach((row) => {
          const hash = row.dataset.select;
          const index = row.querySelector(".movie-index");
          if (!hash || !index || index.querySelector("[data-reel-choice]")) return;
          index.insertAdjacentHTML("beforeend", `<label class="reel-choice"><input data-reel-choice type="checkbox" aria-label="Select reel" ${selected.has(hash) ? "checked" : ""}></label>`);
          const choice = index.querySelector("[data-reel-choice]");
          choice.addEventListener("click", (event) => event.stopPropagation());
          choice.addEventListener("change", (event) => {
            event.stopPropagation();
            if (choice.checked) selected.add(hash); else selected.delete(hash);
            updateControls(library);
          });
        });
        if (!head.querySelector("[data-batch-controls]")) {
          head.insertAdjacentHTML("beforeend", `<div class="batch-controls" data-batch-controls><button type="button" data-batch-all></button><button type="button" class="batch-delete" data-batch-delete disabled></button></div>`);
          head.querySelector("[data-batch-all]").addEventListener("click", () => {
            const visible = [...list.querySelectorAll(".movie")].filter((row) => !row.hidden);
            const everyVisiblePicked = visible.length > 0 && visible.every((row) => selected.has(row.dataset.select));
            visible.forEach((row) => everyVisiblePicked ? selected.delete(row.dataset.select) : selected.add(row.dataset.select));
            updateControls(library);
          });
          head.querySelector("[data-batch-delete]").addEventListener("click", async () => {
            const hashes = [...selected];
            if (!hashes.length || !window.confirm(text().confirm.replace("{n}", hashes.length))) return;
            const button = head.querySelector("[data-batch-delete]");
            button.disabled = true;
            await window.__mmwDeleteMany?.(hashes);
            selected.clear();
            mountBatchControls();
          });
        }
        updateControls(library);
      }
      function updateControls(library) {
        const list = library.querySelector(".library");
        const rows = [...list.querySelectorAll(".movie")];
        rows.forEach((row) => {
          const hash = row.dataset.select;
          row.classList.toggle("batch-picked", selected.has(hash));
          const choice = row.querySelector("[data-reel-choice]");
          if (choice) choice.checked = selected.has(hash);
        });
        const controls = library.querySelector("[data-batch-controls]");
        if (!controls) return;
        const visible = rows.filter((row) => !row.hidden);
        const everyVisiblePicked = visible.length > 0 && visible.every((row) => selected.has(row.dataset.select));
        controls.querySelector("[data-batch-all]").textContent = everyVisiblePicked ? text().clear : text().all;
        const remove = controls.querySelector("[data-batch-delete]");
        remove.disabled = selected.size === 0;
        remove.textContent = selected.size ? `${text().remove} (${selected.size})` : text().remove;
      }
      document.addEventListener("change", (event) => {
        const input = event.target;
        if (input?.id !== "file-input" || !input.files?.length) return;
        event.stopImmediatePropagation();
        event.stopPropagation();
        uploadQueue([...input.files]);
        input.value = "";
      }, true);
      document.addEventListener("drop", (event) => {
        if (!event.target.closest?.("#drop-zone")) return;
        const files = [...event.dataTransfer.files];
        if (!files.length) return;
        event.preventDefault();
        event.stopImmediatePropagation();
        event.stopPropagation();
        uploadQueue(files);
      }, true);
      new MutationObserver(mountBatchControls).observe(document.getElementById("app"), { childList: true, subtree: true });
      mountBatchControls();
    })();
  </script>
  <style>
    /* Signal Cabinet narrow-desktop safeguard: control banks wrap into deliberate rows before they can be clipped. */
    @media (min-width: 681px) and (max-width: 1120px) {
      #library .module-head { flex-wrap: wrap; align-items: center; }
      #library .module-head > h2 { flex: 1 1 auto; }
      #library .module-head > .mono { flex: 0 0 auto; }
      #library .module-head > .reel-search { order: 3; flex: 1 1 100%; min-width: 0; }
      #library .module-head > .batch-controls { order: 4; display: flex; flex: 1 1 100%; flex-wrap: wrap; justify-content: flex-start; width: 100%; margin: 0; }
      #library .module-head > .batch-controls button { flex: 1 1 132px; white-space: nowrap; }
    }
  </style>
